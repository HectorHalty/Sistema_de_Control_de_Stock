name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=apps/api
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web-admin/coverage
            apps/web-public/coverage

  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lch
          POSTGRES_PASSWORD: lch_dev_pass
          POSTGRES_DB: lch_stock
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lch -d lch_stock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=apps/api
      - name: Create lch_stock_test
        env:
          PGPASSWORD: lch_dev_pass
        run: psql -h 127.0.0.1 -U lch -d lch_stock -c "CREATE DATABASE lch_stock_test;"
      - name: Start MinIO
        run: docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minio_admin -e MINIO_ROOT_PASSWORD=minio_dev_pass minio/minio server /data
      - name: MinIO buckets
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c "
            i=0
            until mc alias set local http://127.0.0.1:9000 minio_admin minio_dev_pass; do
              i=\$((i+1))
              if [ \$i -ge 30 ]; then
                echo 'MinIO no respondio dentro de 30 intentos' >&2
                exit 1
              fi
              sleep 1
            done
            mc mb local/lch-media || true
            mc mb local/lch-sponsors || true
            mc mb local/lch-football || true
            mc anonymous set download local/lch-media
            mc anonymous set download local/lch-sponsors
            mc anonymous set download local/lch-football
          "
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://lch:lch_dev_pass@127.0.0.1:5432/lch_stock_test?schema=public
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://lch:lch_dev_pass@127.0.0.1:5432/lch_stock_test?schema=public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
